name: Daily Auto Publish

on:
  schedule:
    # Runs everyday at 00:00 UTC (09:00 AM KST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily publisher script
        run: |
          python3 scripts/publish_next.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ public/images/ content_queue/
          if git diff --staged --quiet; then
            echo "No changes to commit. Queue may be empty."
          else
            git commit -m "chore(auto-publish): release daily article package [skip ci]"
            git push origin main
          fi
